
name: CI/CD

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore DiscordBot.sln

      - name: Build solution
        run: dotnet build DiscordBot.sln --configuration Release --no-restore

  docker:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: az acr login --name discordmoviebotacr

      - name: Build and push Docker image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            --sbom=false \
            --tag discordmoviebotacr.azurecr.io/discord-movie-bot:${{ github.sha }} \
            --push \
            .

      - name: Deploy to Azure Container Apps
        run: |
          az containerapp update \
            --name discord-movie-bot \
            --resource-group rg-discord-movie-bot \
            --image discordmoviebotacr.azurecr.io/discord-movie-bot:${{ github.sha }}

